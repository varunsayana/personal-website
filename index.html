<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming Soon — Varun Sayana</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: Inter, system-ui, sans-serif; }

    @keyframes fade {
      from { opacity:0; transform: translateY(16px); }
      to { opacity:1; transform: translateY(0); }
    }
  </style>
</head>

<body class="min-h-screen text-white overflow-hidden">

  <!-- Background Image -->
  <div class="fixed inset-0 -z-10">
    <img 
      src="https://images.unsplash.com/photo-1635776063043-ab23b4c226f6?q=80&w=2532&auto=format&fit=crop"
      alt=""
      class="w-full h-full object-cover"
    />
    <div class="absolute inset-0 bg-black/55"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/60 to-black"></div>
  </div>

  <!-- Name (more pronounced) -->
  <div class="absolute top-6 left-6">
    <div class="px-4 py-2 rounded-full border border-white/25 backdrop-blur-md bg-white/10 shadow-lg">
      <span class="text-sm font-semibold tracking-[0.28em] uppercase text-white">
        Varun Sayana
      </span>
    </div>
  </div>

  <!-- Main Content -->
  <main class="min-h-screen flex items-center px-8">
    <div class="max-w-xl animate-[fade_1s_ease_forwards]">

      <h1 class="text-[clamp(3rem,6vw,5rem)] font-semibold leading-tight tracking-tight">
        Coming soon.
      </h1>

      <p class="mt-6 text-lg text-white/75 max-w-md">
        This portfolio is under construction.
      </p>

      <div class="mt-10 inline-flex items-center gap-3 px-4 py-2 rounded-full 
                  border border-white/20 backdrop-blur-md bg-white/10 shadow-md">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-400 animate-pulse"></span>
        <span class="text-xs tracking-widest uppercase text-white/80">
          Launching soon
        </span>
      </div>

    </div>
  </main>

</body>
</html>
